<!DOCTYPE html>
<html lang="en" data-theme="light" data-palette="teal" data-font="nunito">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Buzzend · Workout Complete</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/palettes.css" />
  <link rel="stylesheet" href="../../css/fonts.css" />
  <link rel="stylesheet" href="../../css/app.css" />
  <link rel="stylesheet" href="../../css/screens/moment.css" />
  <link rel="stylesheet" href="../../css/screens/congrats.css" />
  <script src="../../js/app.js"></script>
</head>
<body>
  <div class="state-switch">
    <button data-v="1" onclick="setV('1')">1 · Form word</button>
    <button data-v="2" onclick="setV('2')">2 · Form meter</button>
    <button data-v="3" onclick="setV('3')">3 · Clean reps</button>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()" style="top:64px">🌙</button>

  <div class="screen-box"><div id="flow"></div></div>

  <script src="../../js/components/icons.js"></script>
  <script src="../../js/screens/aiflow.js"></script>
  <script>
    const _p = new URLSearchParams(location.search);
    const ex = _p.get("ex") || "squat";
    function setV(v) {
      AIFlow.start(document.getElementById("flow"), "congrats:" + v + ":" + ex);
      document.querySelectorAll(".state-switch button").forEach(b => b.classList.toggle("active", b.dataset.v === v));
    }
    setV(_p.get("v") || "1");
  </script>
</body>
</html>
