<!DOCTYPE html>
<html lang="en" data-theme="light" data-palette="energyorange" data-font="nunito">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzzend · Member Stats — Pace redesign</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/palettes.css" />
  <link rel="stylesheet" href="../../css/fonts.css" />
  <link rel="stylesheet" href="../../css/app.css" />
<style>
  body{ padding:28px 22px 70px; }
  .wrap{ max-width:1520px; margin:0 auto; }
  a.back{ color:var(--text-secondary); font:700 14px var(--font); text-decoration:none; }
  h1{ font:900 26px var(--font); letter-spacing:-.4px; margin:6px 0; }
  .lede{ font:600 14px var(--font); color:var(--text-secondary); margin:0 0 18px; max-width:96ch; line-height:1.6; }
  .lede b{ color:var(--text-primary); font-weight:800; } .lede code{ font-size:12.5px; background:var(--surface-alt); padding:1px 5px; border-radius:5px; }
  .bar{ display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px 16px; box-shadow:var(--shadow-card); margin:0 0 24px; }
  .blab{ font:800 11px var(--font); letter-spacing:.6px; text-transform:uppercase; color:var(--text-tertiary); margin-right:9px; }
  .seg{ display:inline-flex; background:var(--surface-alt); border-radius:11px; padding:3px; gap:2px; }
  .seg button{ border:0; background:transparent; font:800 12.5px var(--font); font-family:var(--font); color:var(--text-secondary); padding:7px 12px; border-radius:8px; cursor:pointer; }
  .seg button.on{ background:var(--surface); color:var(--primary); box-shadow:0 1px 3px rgba(0,0,0,.16); }
  .deck{ display:flex; gap:30px; align-items:flex-start; flex-wrap:wrap; }
  .col{ width:390px; } .col .cap{ font:900 16px var(--font); margin:0 0 3px; }
  .col .sub{ font:600 12.5px var(--font); color:var(--text-secondary); margin:0 0 13px; min-height:52px; line-height:1.5; }
  .screen-box{ box-shadow:0 14px 44px rgba(0,0,0,.17); height:820px; min-height:0; width:390px; }
  .screen{ display:flex; flex-direction:column; height:100%; min-height:0; }
  svg{ display:block; } .ic{ fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .appbar{ display:flex; align-items:center; gap:12px; padding:6px 16px 12px; }
  .ab-btn{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:1px solid var(--border); color:var(--text-primary); flex:none; cursor:pointer; }
  .ab-btn .ic{ width:17px; height:17px; }
  .ab-t{ flex:1; font:900 17px var(--font); color:var(--text-primary); }
  .ab-s{ font:700 11.5px var(--font); color:var(--text-tertiary); margin-top:2px; display:flex; align-items:center; gap:6px; }
  .ab-s .exi{ width:15px; height:15px; display:inline-flex; } .ab-s .exi img{ width:100%; height:100%; object-fit:contain; }
  .body{ flex:1; min-height:0; overflow-y:auto; scrollbar-width:none; padding:0 16px 20px; }
  .body::-webkit-scrollbar{ display:none; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; }
  .av{ border-radius:50%; display:grid; place-items:center; font-weight:900; color:#fff; flex:none; letter-spacing:-.3px; }
  .av.ring{ box-shadow:0 0 0 2.5px var(--surface), 0 0 0 4.5px var(--primary); }
  .sec{ font:900 12px var(--font); letter-spacing:.5px; text-transform:uppercase; color:var(--text-tertiary); margin:16px 0 9px; display:flex; justify-content:space-between; align-items:baseline; }
  .sec s{ font:800 10px var(--font); text-decoration:none; color:var(--text-tertiary); text-transform:none; letter-spacing:0; }

  /* hero */
  .hero{ padding:16px; display:flex; flex-direction:column; align-items:center; text-align:center; position:relative; overflow:hidden; }
  .hero .glowb{ position:absolute; top:-70px; left:50%; margin-left:-90px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle,color-mix(in srgb,var(--primary) 28%,transparent),transparent 70%); }
  .avwrap{ position:relative; }
  .medal{ position:absolute; right:-6px; bottom:-4px; min-width:26px; height:26px; padding:0 6px; border-radius:99px; background:var(--primary); color:var(--on-primary); border:2.5px solid var(--surface); display:grid; place-items:center; font:900 11px var(--font); }
  .nrow{ display:inline-flex; align-items:center; gap:3px; margin-top:9px; }
  .nm{ font:900 19px var(--font); color:var(--text-primary); } .nrow .ic{ width:15px; height:15px; color:var(--text-tertiary); }
  .meta{ font:700 12px var(--font); color:var(--text-tertiary); margin-top:2px; }
  .total{ font:900 40px var(--font); letter-spacing:-1.6px; color:var(--text-primary); margin-top:12px; line-height:1; font-variant-numeric:tabular-nums; }
  .unit{ font:900 10.5px var(--font); letter-spacing:2px; text-transform:uppercase; color:var(--text-tertiary); margin-top:3px; }
  .prog{ width:100%; height:8px; border-radius:99px; background:var(--surface-alt); margin-top:14px; overflow:hidden; }
  .prog i{ display:block; height:100%; border-radius:99px; background:var(--primary); }
  .pl{ display:flex; justify-content:space-between; width:100%; font:800 10.5px var(--font); color:var(--text-tertiary); margin-top:6px; }
  .src{ display:inline-flex; align-items:center; gap:5px; margin-top:12px; padding:5px 10px; border-radius:99px; background:var(--surface-alt); font:800 10px var(--font); letter-spacing:.3px; color:var(--text-secondary); text-transform:uppercase; }
  .src .ic{ width:12px; height:12px; color:var(--primary); }

  /* tiles */
  .tiles{ display:grid; gap:8px; margin-top:12px; } .tiles.t4{ grid-template-columns:repeat(2,1fr); } .tiles.t3{ grid-template-columns:repeat(3,1fr); }
  .tile{ padding:12px 10px; display:flex; flex-direction:column; gap:2px; }
  .tile .tv{ font:900 18px var(--font); color:var(--text-primary); font-variant-numeric:tabular-nums; line-height:1; }
  .tile .tv.p{ color:var(--primary); }
  .tile .tl{ font:800 9.5px var(--font); letter-spacing:.5px; text-transform:uppercase; color:var(--text-tertiary); }
  .tile .th{ display:flex; align-items:center; gap:6px; } .tile .th .ic{ width:14px; height:14px; color:var(--primary); }

  /* spark */
  .spark{ display:flex; align-items:flex-end; gap:4px; height:62px; padding:12px 12px 0; }
  .spark i{ flex:1; border-radius:4px 4px 0 0; background:color-mix(in srgb,var(--primary) 26%,transparent); min-height:3px; } .spark i.pk{ background:var(--primary); }
  .spark-x{ display:flex; justify-content:space-between; font:800 9px var(--font); color:var(--text-tertiary); padding:6px 12px 11px; text-transform:uppercase; letter-spacing:.4px; }

  /* day rows */
  .dayrow{ display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:13px; background:var(--surface); border:1px solid var(--border); margin-bottom:6px; }
  .dayrow.today{ border-color:color-mix(in srgb,var(--primary) 45%,transparent); background:color-mix(in srgb,var(--primary) 6%,transparent); }
  .daychip{ width:38px; flex:none; text-align:center; }
  .daychip b{ display:block; font:900 15px var(--font); color:var(--text-primary); line-height:1; }
  .daychip span{ font:800 9px var(--font); letter-spacing:.5px; text-transform:uppercase; color:var(--text-tertiary); }
  .daybar{ flex:1; height:8px; border-radius:99px; background:var(--surface-alt); overflow:hidden; }
  .daybar i{ display:block; height:100%; border-radius:99px; background:color-mix(in srgb,var(--primary) 70%,transparent); }
  .dayval{ font:900 13.5px var(--font); color:var(--text-primary); font-variant-numeric:tabular-nums; min-width:72px; text-align:right; }
  .dayval s{ display:block; font:700 9px var(--font); color:var(--text-tertiary); text-decoration:none; margin-top:2px; }
  .restrow{ display:flex; align-items:center; gap:8px; padding:3px 12px 9px; font:800 10px var(--font); color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.4px; }
  .restrow i{ flex:1; height:1px; background:var(--divider); }
  .mhead{ font:900 11.5px var(--font); color:var(--text-secondary); padding:11px 2px 7px; }

  /* B · Activity Ring dashboard */
  .rhead{ display:flex; align-items:center; justify-content:center; gap:9px; padding:6px 0 2px; }
  .rhead .rn{ font:900 16px var(--font); color:var(--text-primary); }
  .rankpill{ display:inline-flex; align-items:center; gap:3px; font:900 10px var(--font); color:var(--on-primary); background:var(--primary); border-radius:99px; padding:3px 9px; }
  .rankpill .ic{ width:11px; height:11px; }
  .ring{ position:relative; width:172px; height:172px; margin:8px auto 4px; }
  .ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle{ fill:none; stroke-width:11; } .ring .rt{ stroke:var(--surface-alt); } .ring .rp{ stroke:var(--primary); stroke-linecap:round; }
  .ring .rin{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .rin b{ font:900 36px var(--font); letter-spacing:-1.4px; color:var(--text-primary); font-variant-numeric:tabular-nums; line-height:1; }
  .ring .rin span{ font:900 9px var(--font); letter-spacing:1.6px; text-transform:uppercase; color:var(--text-tertiary); margin-top:4px; }
  .ring .rin em{ font:800 10.5px var(--font); font-style:normal; color:var(--primary); margin-top:7px; }
  .rlead{ text-align:center; font:800 10.5px var(--font); color:var(--text-tertiary); margin-top:2px; }
  .sgrid{ display:grid; gap:1px; background:var(--divider); overflow:hidden; }
  .sgrid.g2{ grid-template-columns:1fr 1fr; } .sgrid.g3{ grid-template-columns:repeat(3,1fr); }
  .scell{ background:var(--surface); padding:14px 12px; display:flex; flex-direction:column; gap:5px; }
  .scell .sh{ display:flex; align-items:center; gap:6px; color:var(--primary); } .scell .sh .ic{ width:14px; height:14px; }
  .scell .sv{ font:900 19px var(--font); color:var(--text-primary); font-variant-numeric:tabular-nums; line-height:1; } .scell .sv small{ font:800 11px var(--font); color:var(--text-tertiary); }
  .scell .sl{ font:800 9.5px var(--font); letter-spacing:.5px; text-transform:uppercase; color:var(--text-tertiary); }
  .wk{ display:flex; align-items:flex-end; gap:6px; padding:14px 12px 8px; height:96px; }
  .wk .wd{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .wk .wd i{ width:100%; border-radius:6px 6px 0 0; background:color-mix(in srgb,var(--primary) 24%,transparent); min-height:4px; }
  .wk .wd.pk i{ background:var(--primary); }
  .wk .wd b{ font:800 9px var(--font); color:var(--text-tertiary); text-transform:uppercase; } .wk .wd.pk b{ color:var(--primary); }

  /* C · Stat Board (editorial) */
  .bhero{ padding:15px 15px 16px; }
  .bh-top{ display:flex; align-items:center; gap:11px; }
  .bh-top .bn{ flex:1; min-width:0; } .bh-top .bn b{ display:block; font:900 16px var(--font); color:var(--text-primary); } .bh-top .bn span{ font:700 11.5px var(--font); color:var(--text-tertiary); }
  .bh-top .ic{ width:16px; height:16px; color:var(--text-tertiary); }
  .bh-tot{ display:flex; align-items:baseline; gap:8px; margin-top:14px; } .bh-tot b{ font:900 42px var(--font); letter-spacing:-1.6px; color:var(--text-primary); font-variant-numeric:tabular-nums; line-height:1; }
  .bh-tot span{ font:900 10.5px var(--font); letter-spacing:1.4px; text-transform:uppercase; color:var(--text-tertiary); }
  .bline{ height:7px; border-radius:99px; background:var(--surface-alt); overflow:hidden; margin-top:14px; } .bline i{ display:block; height:100%; border-radius:99px; background:var(--primary); }
  .blab2{ display:flex; justify-content:space-between; font:800 10.5px var(--font); color:var(--text-tertiary); margin-top:6px; }
  .strip{ display:flex; } .strip .st{ flex:1; padding:13px 4px; text-align:center; } .strip .st + .st{ border-left:1px solid var(--divider); }
  .strip .st b{ display:block; font:900 18px var(--font); color:var(--text-primary); font-variant-numeric:tabular-nums; } .strip .st b small{ font:800 10px var(--font); color:var(--text-tertiary); } .strip .st.p b{ color:var(--primary); }
  .strip .st span{ font:800 9px var(--font); letter-spacing:.4px; text-transform:uppercase; color:var(--text-tertiary); }
  .cbar{ display:flex; align-items:flex-end; gap:5px; height:70px; padding:12px 12px 0; } .cbar i{ flex:1; border-radius:5px 5px 0 0; background:color-mix(in srgb,var(--primary) 26%,transparent); min-height:4px; } .cbar i.pk{ background:var(--primary); }
  .cbx{ display:flex; justify-content:space-between; font:800 9px var(--font); color:var(--text-tertiary); padding:6px 12px 11px; text-transform:uppercase; }
  .logrow{ display:flex; align-items:center; gap:12px; padding:11px 13px; border-bottom:1px solid var(--divider); } .logrow:last-child{ border-bottom:0; } .logrow.today{ background:color-mix(in srgb,var(--primary) 5%,transparent); }
  .logrow .ld{ width:40px; flex:none; text-align:center; } .ld b{ display:block; font:900 15px var(--font); color:var(--text-primary); line-height:1; } .ld span{ font:800 8.5px var(--font); letter-spacing:.4px; text-transform:uppercase; color:var(--text-tertiary); }
  .logrow .lm{ flex:1; min-width:0; } .lm .lr2{ font:900 15px var(--font); color:var(--text-primary); font-variant-numeric:tabular-nums; } .lm .lr2 small{ font:800 10px var(--font); color:var(--text-tertiary); }
  .chips{ display:flex; gap:6px; margin-top:5px; } .chip{ display:inline-flex; align-items:center; gap:4px; font:800 10px var(--font); padding:3px 8px; border-radius:99px; background:var(--surface-alt); color:var(--text-secondary); } .chip .ic{ width:11px; height:11px; color:var(--primary); }
  .lvbar{ width:5px; align-self:stretch; min-height:26px; border-radius:99px; background:var(--surface-alt); position:relative; flex:none; } .lvbar i{ position:absolute; left:0; right:0; bottom:0; border-radius:99px; background:color-mix(in srgb,var(--primary) 75%,transparent); }

  .cta{ display:flex; gap:8px; margin-top:14px; }
  .btn{ flex:1; display:inline-flex; align-items:center; justify-content:center; gap:7px; border:0; border-radius:13px; padding:13px 8px; font:800 13.5px var(--font); font-family:var(--font); cursor:pointer; }
  .btn .ic{ width:16px; height:16px; } .btn.primary{ background:var(--primary); color:var(--on-primary); } .btn.ghost{ background:transparent; color:var(--text-primary); box-shadow:inset 0 0 0 1.5px var(--border); }
  .empty{ text-align:center; padding:44px 20px; } .empty .ic{ width:34px; height:34px; margin:0 auto 10px; color:var(--text-tertiary); } .empty b{ display:block; font:900 14.5px var(--font); } .empty span{ font:700 12.5px var(--font); color:var(--text-secondary); }
  .skel{ background:var(--surface-alt); border-radius:10px; animation:pulse 1.3s ease-in-out infinite; } @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.5} }

  /* data-grounding panel */
  .facts{ width:390px; margin-top:16px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:15px; box-shadow:var(--shadow-card); }
  .facts h4{ font:900 13px var(--font); margin:0 0 9px; }
  .fgrp{ margin-top:10px; } .fgrp .gt{ display:flex; align-items:center; gap:6px; font:900 9.5px var(--font); letter-spacing:.6px; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:5px; } .fgrp .gt b{ width:8px; height:8px; border-radius:3px; }
  .fgrp ul{ margin:0; padding:0; list-style:none; } .fgrp li{ font:700 11.5px var(--font); color:var(--text-secondary); line-height:1.55; padding:3px 0 3px 12px; position:relative; }
  .fgrp li::before{ content:'·'; position:absolute; left:3px; color:var(--text-tertiary); font-weight:900; } .fgrp li b{ color:var(--text-primary); font-weight:800; } .fgrp li code{ font-size:11px; background:var(--surface-alt); padding:1px 4px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../index.html">← Home launcher</a>
  <div class="bar">
    <div><span class="blab">Workout</span>
      <div class="seg" id="segWk">
        <button data-w="pushup" class="on">Push-ups</button>
        <button data-w="squat">Squats</button>
        <button data-w="jumping">Jumping Jacks</button>
        <button data-w="steps">Steps · walk</button>
      </div></div>
    <div><span class="blab">Viewer</span>
      <div class="seg" id="segRole"><button data-r="member" class="on">Member</button><button data-r="admin">Owner</button></div></div>
    <div><span class="blab">State</span>
      <div class="seg" id="segState"><button data-s="loaded" class="on">Loaded</button><button data-s="empty">No records</button><button data-s="loading">Loading</button></div></div>
    <div><span class="blab">Color</span>
      <div class="seg" id="segPal">
        <button data-swatch="energyorange" class="on">Orange</button>
        <button data-swatch="teal">Teal</button>
        <button data-swatch="electricblue">Blue</button>
        <button data-swatch="aipurple">Purple</button>
      </div></div>
  </div>
  <div class="deck" id="deck"></div>
</div>
<button class="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>

<script src="../../js/components/icons.js"></script>
<script>
const ICON={
 back:'<path d="m15 18-6-6 6-6"/>', chev:'<path d="m9 18 6-6-6-6"/>',
 dots:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
 clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
 bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-6z"/>',
 gauge:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
 trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
 flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
 target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
 pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
 phone:'<rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M12 18h.01"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
 msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
 x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', chart:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
 inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'};
const svg=(n,s)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24">${ICON[n]||''}</svg>`;
const exImg=(key,s)=>{ try{ return `<span class="exi" style="width:${s}px;height:${s}px">${window.Icons.workout(key,s,'outlined')}</span>`; }catch(e){ return svg('bolt',s); } };
const fmt=v=>Math.round(v).toLocaleString('en-US');
const AVC=['#7c5cff','#e2725b','#2aa79b','#e0a92c','#4a7cf3'];
const av=(name,size,ring)=>{ const i=name.charCodeAt(0)%AVC.length;
  return `<div class="av${ring?' ring':''}" style="width:${size}px;height:${size}px;background:${AVC[i]};font-size:${Math.round(size*.38)}px">${name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>`; };
/* time + pace formatting */
const fmtDur=sec=>{ if(sec<60) return sec+'s'; const m=Math.floor(sec/60), s=sec%60; if(m<60) return s?`${m}m ${s}s`:`${m}m`; const h=Math.floor(m/60); return `${h}h ${m%60}m`; };
const pc=p=>p>=20?Math.round(p):Math.round(p*10)/10;         // pace: reps per minute
const km=steps=>(steps*1.7*0.414/1000);                      // WorkoutMetrics stride math (client-side)
const fmtKm=steps=>{ const v=km(steps); return (v<1?Math.round(v*100)/100:v.toFixed(1))+' km'; };

/* ── real-shaped data. Rep types carry per-day durationSeconds → time + pace. Steps have none → distance. ── */
const REP_DAYS=[
  {d:'Fri 24',reps:120,m:'Jul',today:1},{d:'Thu 23',reps:80,m:'Jul'},{d:'Wed 22',reps:100,m:'Jul'},
  {d:'Tue 21',reps:60,m:'Jul'},{d:'Mon 20',reps:95,m:'Jul'},
  {d:'Sat 18',reps:110,m:'Jul',gapBefore:1},{d:'Thu 16',reps:75,m:'Jul',gapBefore:1},{d:'Wed 15',reps:105,m:'Jul'},
  {d:'Mon 30',reps:90,m:'Jun',gapBefore:14},{d:'Sun 29',reps:65,m:'Jun'}];
const JIT=[1.05,0.9,1.02,0.88,1.08,1.0,0.95,1.04,0.93,1.07];   // per-day pace variance → time isn't flat
const STEP_DAYS=[
  {d:'Fri 24',reps:8240,m:'Jul',today:1},{d:'Thu 23',reps:11020,m:'Jul'},{d:'Wed 22',reps:6410,m:'Jul'},
  {d:'Tue 21',reps:9980,m:'Jul'},{d:'Mon 20',reps:12300,m:'Jul'},{d:'Sun 19',reps:7150,m:'Jul'},
  {d:'Sat 18',reps:10460,m:'Jul'},{d:'Fri 17',reps:5900,m:'Jul'},
  {d:'Mon 30',reps:9120,m:'Jun',gapBefore:11},{d:'Sun 29',reps:8700,m:'Jun'}];
const TYPES={
  pushup:{key:'pushup',name:'Push-ups',label:'push-ups',unit:'reps',isRep:true,pace:19,ch:'30-Day Push Club',src:'Camera-verified · counted by pose detection',srcIcon:'shield'},
  squat: {key:'squat', name:'Squats',  label:'squats',   unit:'reps',isRep:true,pace:25,ch:'Squat Squad',    src:'Camera-verified · counted by pose detection',srcIcon:'shield'},
  jumping:{key:'jumping',name:'Jumping Jacks',label:'jumping jacks',unit:'reps',isRep:true,pace:46,ch:'Cardio Kings',src:'Camera-verified · counted by pose detection',srcIcon:'shield'},
  steps: {key:'walk',  name:'Steps',   label:'steps',    unit:'steps',isRep:false,ch:'July Step-Up',        src:'Device-tracked · phone step counter',srcIcon:'phone'},
};
const MEMBER={name:'Aisha Verma',rank:2};

let WK='pushup', ROLE='member', ST='loaded';
function derive(){
  const t=TYPES[WK], raw=t.isRep?REP_DAYS:STEP_DAYS;
  const days=raw.map((x,i)=>{ const o={...x}; if(t.isRep){ o.dur=Math.round(o.reps/(t.pace*JIT[i])*60); o.pace=o.reps/(o.dur/60); } return o; });
  const total=days.reduce((s,r)=>s+r.reps,0), best=Math.max(...days.map(r=>r.reps)), activeDays=days.length, avg=Math.round(total/activeDays);
  const totalSec=t.isRep?days.reduce((s,r)=>s+r.dur,0):0, avgPace=t.isRep?total/(totalSec/60):0;
  const bestPaceDay=t.isRep?days.reduce((a,b)=>b.pace>a.pace?b:a):null, bigDay=days.reduce((a,b)=>b.reps>a.reps?b:a);
  const leaderV=Math.round(total*1.16), pctLeader=Math.round(total/leaderV*100);
  return {t,days,total,best,activeDays,avg,totalSec,avgPace,bestPaceDay,bigDay,leaderV,pctLeader,peak:best};
}

const statusbar=`<div class="statusbar"><span>9:41</span><span>5G · 100%</span></div>`;
const appbar=(title,exkey,chline,extra='')=>`<div class="appbar"><span class="ab-btn">${svg('back',17)}</span>
  <div class="ab-t">${title}<div class="ab-s">${exImg(exkey,15)} ${chline}</div></div>${extra||''}</div>`;
const removeBtn=()=>ROLE==='admin'?`<button class="btn ghost" style="color:var(--danger);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 40%,transparent)">${svg('x',16)} Remove</button>`:'';
const emptyState=()=>`<div class="card empty">${svg('inbox',34)}<b>No records yet</b><span>This member hasn't logged a day in this challenge.</span></div>`;
const loadingState=()=>`<div class="card" style="padding:14px">${[0,1,2,3].map(()=>`<div class="skel" style="height:44px;margin-bottom:8px"></div>`).join('')}</div>`;

/* ── A · Effort Profile ── */
function vA(){
  const D=derive(), t=D.t;
  const body= ST!=='loaded' ? (ST==='empty'?emptyState():loadingState()) : `
    ${t.isRep?`<div class="tiles t4">
        <div class="card tile"><div class="tv">${fmt(D.best)}</div><div class="tl">Best day</div></div>
        <div class="card tile"><div class="tv">${fmt(D.avg)}</div><div class="tl">Daily avg</div></div>
        <div class="card tile"><div class="th">${svg('clock',14)}<div class="tv">${fmtDur(D.totalSec)}</div></div><div class="tl">Active time</div></div>
        <div class="card tile"><div class="th">${svg('bolt',14)}<div class="tv p">${pc(D.avgPace)}<small style="font-size:11px">/min</small></div></div><div class="tl">Avg pace</div></div>
      </div>`:`<div class="tiles t3">
        <div class="card tile"><div class="tv">${fmt(D.best)}</div><div class="tl">Best day</div></div>
        <div class="card tile"><div class="tv">${fmt(D.avg)}</div><div class="tl">Daily avg</div></div>
        <div class="card tile"><div class="th">${svg('pin',14)}<div class="tv">${fmtKm(D.total)}</div></div><div class="tl">Distance</div></div>
      </div>`}
    <div class="sec"><span>Daily trend</span><s>peak ${fmt(D.peak)} ${t.unit}</s></div>
    <div class="card"><div class="spark">${D.days.slice().reverse().map(x=>`<i class="${x.reps===D.best?'pk':''}" style="height:${Math.round(x.reps/D.best*100)}%"></i>`).join('')}</div>
      <div class="spark-x"><span>${D.days[D.days.length-1].m} ${D.days[D.days.length-1].d.split(' ')[1]}</span><span>${t.isRep?pc(D.avgPace)+'/min avg':fmtKm(D.total)}</span><span>${D.days[0].d.split(' ')[1]} ${D.days[0].m}</span></div></div>
    <div class="sec"><span>Every day</span><s>${D.activeDays} active days</s></div>
    ${dayList(D)}
    <button class="btn ghost" style="margin-top:6px">Load older days →</button>`;
  return `${statusbar}${appbar('Statistics',t.key,`${t.name} · ${t.ch}`,`<span class="ab-btn">${svg('dots',17)}</span>`)}
    <div class="body">
      <div class="card hero"><div class="glowb"></div>
        <div class="avwrap">${av(MEMBER.name,72,true)}<span class="medal">#${MEMBER.rank}</span></div>
        <div class="nrow"><span class="nm">${MEMBER.name}</span>${svg('chev',15)}</div>
        <div class="meta">${D.activeDays} active days · Jul 1–31</div>
        <div class="total">${fmt(D.total)}</div><div class="unit">${t.isRep?`${t.label} · ${t.unit}`:t.unit}</div>
        <div class="prog"><i style="width:${D.pctLeader}%"></i></div>
        <div class="pl"><span>${D.pctLeader}% of the leader</span><span>You lead · ${fmt(D.leaderV)}</span></div>
        <div class="src">${svg(t.srcIcon,12)} ${t.src}</div></div>
      ${body}
      ${ROLE==='admin'?`<div class="cta">${removeBtn()}</div>`:''}
      <div style="height:12px"></div>
    </div>`;
}
function dayList(D){ const t=D.t; let last=null; return D.days.map(x=>{
  const h=x.m!==last?`<div class="mhead">${x.m}, 2026</div>`:''; last=x.m;
  const gap=x.gapBefore?`<div class="restrow"><i></i>${x.gapBefore} rest day${x.gapBefore>1?'s':''}<i></i></div>`:'';
  const sub=t.isRep?`${fmtDur(x.dur)} · ${pc(x.pace)}/min`:fmtKm(x.reps);
  return h+gap+`<div class="dayrow${x.today?' today':''}"><div class="daychip"><b>${x.d.split(' ')[1]}</b><span>${x.today?'today':x.d.split(' ')[0]}</span></div>
    <div class="daybar"><i style="width:${Math.round(x.reps/D.best*100)}%"></i></div>
    <div class="dayval">${fmt(x.reps)}<s>${sub}</s></div></div>`; }).join(''); }

/* ── B · Activity Ring — modern health-app dashboard ── */
function vB(){
  const D=derive(), t=D.t, circ=326.7, off=circ*(1-D.pctLeader/100);
  const week=D.days.slice(0,7).reverse(), wmax=Math.max(...week.map(x=>x.reps));
  const grid = t.isRep
    ? `<div class="card sgrid g2" style="padding:0">
        <div class="scell"><div class="sh">${svg('flame',14)}</div><div class="sv">${fmt(D.best)}</div><div class="sl">Best day</div></div>
        <div class="scell"><div class="sh">${svg('chart',14)}</div><div class="sv">${fmt(D.avg)}</div><div class="sl">Daily avg</div></div>
        <div class="scell"><div class="sh">${svg('clock',14)}</div><div class="sv">${fmtDur(D.totalSec)}</div><div class="sl">Active time</div></div>
        <div class="scell"><div class="sh">${svg('bolt',14)}</div><div class="sv" style="color:var(--primary)">${pc(D.avgPace)}<small>/min</small></div><div class="sl">Avg pace</div></div></div>`
    : `<div class="card sgrid g3" style="padding:0">
        <div class="scell"><div class="sh">${svg('flame',14)}</div><div class="sv">${fmt(D.best)}</div><div class="sl">Best day</div></div>
        <div class="scell"><div class="sh">${svg('chart',14)}</div><div class="sv">${fmt(D.avg)}</div><div class="sl">Daily avg</div></div>
        <div class="scell"><div class="sh">${svg('pin',14)}</div><div class="sv">${fmtKm(D.total)}</div><div class="sl">Distance</div></div></div>`;
  const body= ST!=='loaded' ? (ST==='empty'?emptyState():loadingState()) : `
    ${grid}
    <div class="sec"><span>This week</span><s>peak ${fmt(wmax)} ${t.unit}</s></div>
    <div class="card"><div class="wk">${week.map(x=>`<div class="wd${x.reps===wmax?' pk':''}"><i style="height:${Math.round(x.reps/wmax*100)}%"></i><b>${x.d.split(' ')[0][0]}</b></div>`).join('')}</div></div>
    <button class="btn ghost" style="margin-top:8px">See all ${D.activeDays} days →</button>`;
  return `${statusbar}${appbar('Statistics',t.key,`${t.name} · ${t.ch}`,`<span class="ab-btn">${svg('dots',17)}</span>`)}
    <div class="body">
      <div class="card hero"><div class="glowb"></div>
        <div class="rhead">${av(MEMBER.name,34)}<span class="rn">${MEMBER.name}</span><span class="rankpill">${svg('trophy',11)} #${MEMBER.rank}</span></div>
        <div class="ring"><svg viewBox="0 0 120 120"><circle class="rt" cx="60" cy="60" r="52"/><circle class="rp" cx="60" cy="60" r="52" style="stroke-dasharray:${circ};stroke-dashoffset:${off}"/></svg>
          <div class="rin"><b>${fmt(D.total)}</b><span>${t.unit}</span><em>${D.pctLeader}% of leader</em></div></div>
        <div class="rlead">Leader · ${fmt(D.leaderV)}</div>
        <div class="src">${svg(t.srcIcon,12)} ${t.src}</div></div>
      ${body}
      ${ROLE==='admin'?`<div class="cta">${removeBtn()}</div>`:'<div style="height:12px"></div>'}
    </div>`;
}

/* ── C · Stat Board — editorial, left-aligned, detailed day log ── */
function vC(){
  const D=derive(), t=D.t;
  const week=D.days.slice(0,7).reverse(), wmax=Math.max(...week.map(x=>x.reps));
  const strip = t.isRep
    ? `<div class="card strip" style="padding:0">
        <div class="st"><b>${fmt(D.best)}</b><span>Best day</span></div>
        <div class="st"><b>${fmt(D.avg)}</b><span>Daily avg</span></div>
        <div class="st"><b>${Math.round(D.totalSec/60)}<small>m</small></b><span>Active</span></div>
        <div class="st p"><b>${pc(D.avgPace)}<small>/min</small></b><span>Pace</span></div></div>`
    : `<div class="card strip" style="padding:0">
        <div class="st"><b>${fmt(D.best)}</b><span>Best day</span></div>
        <div class="st"><b>${fmt(D.avg)}</b><span>Daily avg</span></div>
        <div class="st"><b>${fmtKm(D.total)}</b><span>Distance</span></div></div>`;
  const rows = D.days.map(x=>{
    const chips = t.isRep
      ? `<span class="chip">${svg('bolt',11)} ${pc(x.pace)}/min</span><span class="chip">${svg('clock',11)} ${fmtDur(x.dur)}</span>`
      : `<span class="chip">${svg('pin',11)} ${fmtKm(x.reps)}</span>`;
    return `<div class="logrow${x.today?' today':''}"><div class="ld"><b>${x.d.split(' ')[1]}</b><span>${x.today?'today':x.d.split(' ')[0]}</span></div>
      <div class="lm"><div class="lr2">${fmt(x.reps)} <small>${t.unit}</small></div><div class="chips">${chips}</div></div>
      <div class="lvbar"><i style="height:${Math.round(x.reps/D.best*100)}%"></i></div></div>`; }).join('');
  const body= ST!=='loaded' ? (ST==='empty'?emptyState():loadingState()) : `
    ${strip}
    <div class="sec"><span>Daily trend</span><s>${t.isRep?pc(D.avgPace)+'/min avg':fmtKm(D.total)}</s></div>
    <div class="card"><div class="cbar">${week.map(x=>`<i class="${x.reps===wmax?'pk':''}" style="height:${Math.round(x.reps/wmax*100)}%"></i>`).join('')}</div>
      <div class="cbx"><span>${week[0].d.split(' ')[0]} ${week[0].d.split(' ')[1]}</span><span>peak ${fmt(wmax)}</span><span>${week[week.length-1].d.split(' ')[1]}</span></div></div>
    <div class="sec"><span>Every day</span><s>${D.activeDays} active days</s></div>
    <div class="card" style="padding:2px 0">${rows}</div>
    <button class="btn ghost" style="margin-top:8px">Load older days →</button>`;
  return `${statusbar}${appbar('Statistics',t.key,`${t.name} · ${t.ch}`,`<span class="ab-btn">${svg('dots',17)}</span>`)}
    <div class="body">
      <div class="card bhero">
        <div class="bh-top">${av(MEMBER.name,46,true)}<div class="bn"><b>${MEMBER.name}</b><span>Rank #${MEMBER.rank} · ${D.activeDays} active days</span></div>${svg('chev',16)}</div>
        <div class="bh-tot"><b>${fmt(D.total)}</b><span>${t.isRep?t.label:t.unit}</span></div>
        <div class="bline"><i style="width:${D.pctLeader}%"></i></div>
        <div class="blab2"><span>${D.pctLeader}% of leader</span><span>Leader · ${fmt(D.leaderV)}</span></div>
        <div class="src" style="margin-top:12px">${svg(t.srcIcon,12)} ${t.src}</div></div>
      ${body}
      ${ROLE==='admin'?`<div class="cta">${removeBtn()}</div>`:'<div style="height:12px"></div>'}
    </div>`;
}

const V=[
 {cap:'A · Effort Profile',sub:'The classic centered stats card, made time-aware: rank medal, total vs the leader, best/avg + Active-time & Pace tiles, a daily spark and per-day rows with time and reps/min.',fn:vA},
 {cap:'B · Activity Ring',sub:'A modern health-app take: a progress ring (total vs the leader) as the hero, a clean 2×2 metric grid, and a glanceable 7-day strip. Calmer, more visual, fewer numbers competing.',fn:vB},
 {cap:'C · Stat Board',sub:'Editorial and data-dense: a left-aligned hero with a thin leader line, a divided metric strip, a trend chart, and a detailed day log where pace & time read as pills.',fn:vC},
];
function render(){ document.getElementById('deck').innerHTML=V.map(v=>`<div class="col"><div class="cap">${v.cap}</div><div class="sub">${v.sub}</div>
  <div class="screen-box"><div class="screen">${v.fn()}</div></div></div>`).join(''); }
function setPalette(p){ document.documentElement.setAttribute('data-palette',p); try{localStorage.setItem('buzzend-palette',p)}catch(e){} }
function seg(id,key,set){ document.getElementById(id).addEventListener('click',e=>{ const x=e.target.closest('button'); if(!x)return;
  set(x.dataset[key]); document.querySelectorAll(`#${id} button`).forEach(y=>y.classList.toggle('on',y===x)); if(id!=='segPal') render(); }); }
seg('segWk','w',v=>WK=v); seg('segRole','r',v=>ROLE=v); seg('segState','s',v=>ST=v); seg('segPal','swatch',v=>setPalette(v));
/* optional deep-link for previews: ?w=steps&s=empty */
(function(){ const q=new URLSearchParams(location.search); const on=(id,val)=>{ const b=document.querySelector(`#${id} button[data-${id==='segWk'?'w':'s'}="${val}"]`); if(b){ document.querySelectorAll(`#${id} button`).forEach(y=>y.classList.toggle('on',y===b)); } };
  if(q.get('w')){ WK=q.get('w'); on('segWk',WK); } if(q.get('s')){ ST=q.get('s'); on('segState',ST); } })();
render();
</script>
<script src="../../js/app.js"></script>
<script>/* keep the applied palette in sync with the highlighted toggle (app.js may set its own default) */
(function(){var b=document.querySelector('#segPal button.on'); if(b) document.documentElement.setAttribute('data-palette', b.dataset.swatch);})();</script>
</body>
