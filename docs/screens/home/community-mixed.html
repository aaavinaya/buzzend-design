<!DOCTYPE html>
<html lang="en" data-theme="light" data-palette="teal" data-font="nunito">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Buzzend · Community mixed feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/palettes.css" />
  <link rel="stylesheet" href="../../css/fonts.css" />
  <link rel="stylesheet" href="../../css/app.css" />
  <link rel="stylesheet" href="../../css/screens/home.css" />
  <link rel="stylesheet" href="../../css/screens/community.css" />
  <link rel="stylesheet" href="../../css/screens/community-feed.css" />
  <link rel="stylesheet" href="../../css/screens/community-variants.css" />
  <link rel="stylesheet" href="../../css/screens/community-mixed.css" />
</head>
<body>
  <div class="state-switch">
    <button data-st="rows" onclick="setStyle('rows')">Rows</button>
    <button data-st="podium" onclick="setStyle('podium')">Podium</button>
    <button data-st="session" onclick="setStyle('session')">Session</button>
    <button data-st="dense" onclick="setStyle('dense')">Dense</button>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()" style="top:64px">🌙</button>

  <div class="screen-box">
    <div class="screen home">
      <div class="statusbar"><span>9:41</span><span>5G&nbsp;&nbsp;􀙇&nbsp;&nbsp;100%</span></div>
      <div class="scroll cf" id="content" style="padding:0"></div>
    </div>
    <div class="bottom-nav">
      <a class="nav-item" href="home-v7.html"><span class="ic"><i data-icon="home" data-size="22"></i></span>Home</a>
      <a class="nav-item" href="challenges.html"><span class="ic"><i data-icon="trophy" data-size="22"></i></span>Challenges</a>
      <div class="nav-fab"><button><i data-icon="plus" data-size="26"></i></button></div>
      <a class="nav-item active"><span class="ic"><i data-icon="users" data-size="22"></i></span>Community</a>
      <a class="nav-item" href="profile.html"><span class="ic"><i data-icon="user" data-size="22"></i></span>Profile</a>
    </div>
  </div>

  <script src="../../js/components/dialog.js"></script>
  <script src="../../js/components/icons.js"></script>
  <script src="../../js/screens/social-data.js"></script>
  <script src="../../js/screens/community-mixed.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    function setStyle(s) { CommunityMixed.setStyle(s); }
    const _s = new URLSearchParams(location.search).get("style");
    const _st = ["rows", "podium", "session", "dense"].includes(_s) ? _s : "rows";
    CommunityMixed.start(document.getElementById("content"), _st);
    document.querySelector('.state-switch [data-st="' + _st + '"]').classList.add("active");
  </script>
</body>
</html>
