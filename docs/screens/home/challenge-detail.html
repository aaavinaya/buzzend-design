<!DOCTYPE html>
<html lang="en" data-theme="light" data-palette="teal" data-font="nunito">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Buzzend · Challenge Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/tokens.css" />
  <link rel="stylesheet" href="../../css/palettes.css" />
  <link rel="stylesheet" href="../../css/fonts.css" />
  <link rel="stylesheet" href="../../css/app.css" />
  <link rel="stylesheet" href="../../css/screens/home.css" />
  <link rel="stylesheet" href="../../css/screens/challenges.css" />
  <link rel="stylesheet" href="../../css/screens/challenge-detail.css" />
</head>
<body>
  <div class="state-switch cd-switch">
    <span class="g">Classic</span>
    <button data-v="poster" onclick="setV('poster')">Poster</button>
    <button data-v="winners" onclick="setV('winners')">Winners</button>
    <span class="g">Elimination</span>
    <button data-v="upcoming" onclick="setV('upcoming')">Upcoming</button>
    <button data-v="safe" onclick="setV('safe')">Safe</button>
    <button data-v="risk" onclick="setV('risk')">At risk</button>
    <button data-v="out" onclick="setV('out')">Out</button>
    <button data-v="locking" onclick="setV('locking')">Locking in</button>
    <button data-v="won" onclick="setV('won')">Won</button>
    <button data-v="final" onclick="setV('final')">Finished #2</button>
    <button data-v="left" onclick="setV('left')">Left</button>
    <button data-v="nowinner" onclick="setV('nowinner')">No winner</button>
    <span class="g">Moments</span>
    <button onclick="CElim.moment('through')">Through</button>
    <button onclick="CElim.moment('out')">Out</button>
    <button onclick="CElim.moment('won')">Won</button>
  </div>
  <style>
    /* many states: let the switcher scroll sideways instead of overflowing the viewport */
    .cd-switch { display: flex; align-items: center; max-width: calc(100vw - 24px); overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .cd-switch::-webkit-scrollbar { display: none; }
    .cd-switch .g { font: 900 10px var(--font); letter-spacing: .5px; text-transform: uppercase; color: var(--text-tertiary); padding: 0 4px 0 10px; }
  </style>
  <button class="theme-toggle" onclick="toggleTheme(); CDetail.render()" style="top:64px">🌙</button>

  <div class="screen-box">
    <div class="screen">
      <div class="statusbar" id="sb" style="position:absolute;top:0;left:0;right:0;z-index:30;height:44px"><span>9:41</span><span>5G&nbsp;&nbsp;·&nbsp;&nbsp;100%</span></div>
      <div class="cd" id="app"></div>
    </div>
  </div>

  <script src="../../js/components/dialog.js"></script>
  <script src="../../js/components/icons.js"></script>
  <script src="../../js/screens/social-data.js"></script>
  <script src="../../js/screens/challenge-detail.js"></script>
  <script src="../../js/screens/challenge-elim.js"></script>
  <script src="../../js/app.js"></script>
  <script>
    const _p = new URLSearchParams(location.search);
    const app = document.getElementById("app"), sb = document.getElementById("sb");
    // Classic: poster | winners · Elimination: upcoming | safe | risk | out | locking | won | final | left | nowinner
    const ELIM = ["upcoming", "safe", "risk", "out", "locking", "won", "final", "left", "nowinner"];
    function setV(v) {
      if (ELIM.includes(v)) CElim.start(app, v);
      else CDetail.start(app, _p.get("role") || "viewer", _p.get("tab"), v === "winners" ? "ended" : null);
      sb.style.color = "#fff";
      document.querySelectorAll(".state-switch button[data-v]").forEach(b => b.classList.toggle("active", b.dataset.v === v));
      history.replaceState(null, "", "?v=" + v + (_p.get("role") ? "&role=" + _p.get("role") : ""));
    }
    setV(_p.get("v") || (_p.get("status") === "ended" ? "winners" : _p.get("type") === "elimination" ? "safe" : "poster"));
  </script>
</body>
</html>
