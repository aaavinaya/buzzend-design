<!-- @dsCard group="Store · Google Play v7" -->
<!-- Google Play feature graphic 1024×500: lockup + headline left, camera-view photo in a phone frame right. Focal point kept central. -->
<meta charset="utf-8">
<title>Buzzend — Play feature graphic v7 (1024×500)</title>
<link rel="stylesheet" href="../../brand/brand.css">
<style>
  body { width: 1024px; height: 500px; overflow: hidden; }
  .canvas { width: 1024px; height: 500px; background: linear-gradient(165deg, #111111 0%, #2b1200 70%, #7a3300 100%); color: var(--white); position: relative; }
  .glow.g1 { width: 420px; height: 420px; right: -80px; top: -180px; background: rgba(255,159,67,0.35); }
  .glow.g2 { width: 380px; height: 380px; left: -160px; bottom: -160px; background: rgba(255,107,0,0.35); }
  .lockup { position: absolute; top: 72px; left: 72px; display: flex; align-items: center; gap: 16px; }
  .lockup img { width: 64px; height: 64px; border-radius: 24%; box-shadow: 0 8px 22px rgba(0,0,0,0.35); }
  .lockup .word { font-size: 38px; font-weight: 900; letter-spacing: -0.5px; }
  .tag { position: absolute; left: 72px; top: 178px; width: 560px; font-size: 54px; font-weight: 900; line-height: 1.05; letter-spacing: -1.2px; }
  .tag em { font-style: normal; color: var(--accent); }
  .sub { position: absolute; left: 72px; top: 330px; width: 560px; font-size: 20px; font-weight: 700; line-height: 1.4; color: rgba(255,255,255,0.9); }
  .pill { position: absolute; left: 72px; top: 410px; padding: 9px 16px; border-radius: 99px; font-size: 14px; font-weight: 800; letter-spacing: 2px; background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.4); }
  .phone { position: absolute; right: 86px; top: 44px; width: 232px; background: #101415; border-radius: 30px; padding: 6px; box-shadow: 0 18px 40px rgba(0,0,0,0.45); }
  .phone .screen { border-radius: 25px; overflow: hidden; aspect-ratio: 1536 / 2752; background: #000; }
  .phone .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
<div class="canvas">
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="lockup"><img src="../../assets/app-icon.png" alt=""><div class="word">Buzzend</div></div>
  <div class="tag">Your camera counts <em>your reps.</em></div>
  <div class="sub">Squats · Push-ups · Sit-ups · Lunges · Jumping jacks · Burpees · High knees</div>
  <div class="pill">CHALLENGE FRIENDS · KEEP YOUR STREAK</div>
  <div class="phone"><div class="screen"><img src="../../assets/workout-landmark/squats.jpg" alt=""></div></div>
</div>
